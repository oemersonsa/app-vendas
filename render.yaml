services:
  - type: web
    name: dashboard-vendas
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: APP_ORIGIN
        sync: false
      - key: SQLITE_DATABASE_PATH
        sync: false
